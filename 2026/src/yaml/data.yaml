    type: Presentation
    name: 自己位置推定手法の比較と活用ユースケース
    description: |
      自己位置推定とは、GNSS、カメラ、LiDAR、IMU などさまざまなセンサから得られる情報を基に、自身の位置や姿勢を推定する技術です。ロボットや車両、モバイル端末などが周囲の環境を理解し、安全かつ安定して動作するための重要な技術として広く活用されています。<br>
      一方で、自己位置推定の導入・設計においては、「どのセンサを選ぶべきか判断できない」「センサ構成やアルゴリズムによって精度や安定性、コストが異なる」、「屋内外や昼夜などの環境変化への対応が難しい」といった課題に直面することも少なくありません。<br>
      そこで本セッションでは、自己位置推定の全体像をさまざまな観点から整理し、代表的な手法を比較しながら、用途に応じた選び方と活用ユースケースについてご紹介します。
    lessons:
      - 自己位置推定の重要性と活用領域
      - 自己位置推定の全体像と代表的な手法
      - 自己位置推定手法の活用ユースケース
    level: 初級者向け
    references: []
    speakers:
