    name: レンタルサーバ屋のジレンマ：未利用ドメイン名調査から見えた悩ましいメールセキュリティ事情
    description: |
      レンタルサーバサービスは安価に Web サーバやメールサーバを利用できる反面、他のユーザーとリソースを共有するため、セキュリティの担保が難しくなる側面もあります。<br>
      本セッションでは、レンタルサーバのメールサービスにスポットを当てて、NTTドコモビジネスが保有しているドメイン名を騙った送信元詐称メールを調査する中で見つけた実事例に触れながら、そこに潜むセキュリティリスクとレンタルサーバならではの悩ましい事情との関係性について紹介します。<br>
      レンタルサーバ利用者として、そしてレンタルサーバ事業者として何ができるのか、得られた知見を共有しながら、みなさんとよりよい対策について考えたいと思います.
    lessons:
      - 自社保有ドメイン名を詐称されるリスクの実例とその対策
      - レンタルサーバでメールサービスを利用する際の注意点
      - リソース共用型サービスと一部のメールセキュリティ技術の相性問題で発生しうるリスク
    level: 中級者向け
