  - begin_at: 16:00
    description: |
      IT基盤の健全な運用には多くの情報管理が欠かせません。<br>
      検証環境であってもそれは例外ではなく、こうした「付加価値をうまない重労働」をいかに効率よくこなすかは大きな課題になります。
      本セッションでは、この「付加価値を生まない重労働」を効率化するため、我々が実際に導入・運用しているOSSベースの管理基盤を紹介します。<br>
      具体的には、NetBox(ネットワーク構成管理)、Snipe-IT(資産管理)、FreeRADIUS + PrivacyIDEA(認証基盤)という3つのツールを使った管理の実践事例です。
      各ツールの特徴や連携方法、導入時の注意点を実例とともに解説し、解決方法までの道のりや運用での工夫点を交えながら、同様の課題を抱える組織への参考となる知見を共有します。
    end_at: 16:30
    lessons:
      - IT基盤の情報管理においてOSSを活用したネットワーク構成、物理資産、認証基盤の効率的な管理手法を実例を通して学べます。
      - 今回紹介するOSSがどのように管理業務を効率化するのか、実際の画面や運用フローを交えながら具体的な活用方法と実現可能な管理業務について学ぶことができます。
