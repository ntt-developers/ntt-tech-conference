    type: Presentation
    name: 地理の力で遅延を制す！ ～MEC の“近さ”を活かす選択と切替のリアル～
    description: |
      5G の低遅延を最大限に活かすには、端末近くにサーバを配置する MEC の活用が不可欠です。
      従来のクラウドでは伝送距離が長く、遅延が課題でしたが、MEC により距離を短縮し、遅延を最小化できます。<br>
      しかし、従来の docomo MEC は事前設定された拠点のサーバにしかアクセスできず、位置情報に応じた最適接続や柔軟なリソース割り当てが困難でした。<br>
      そこで、我々は「Edge-as-a-Service（EaaS）」を考案し、拠点を意識せず利用できる仕組みを構築しました。本発表では、EaaS 基盤を用いたメタバースアプリの検証結果と、今後のエッジコンピューティングの方向性について説明します。
    lessons:
      - MECの基本的な仕組みと docomo MEC が抱えている課題
      - EaaS を実現するうえでの設計思想と技術的工夫
