    name: ネットワークコントローラーの内製開発で直面した構成ドリフトに対する課題 ― 現実的な対応とその試み
    description: |
      NTTドコモビジネスではクラウドネイティブ技術を活用した宣言的ネットワークコントローラー『K-SOT』の内製開発に取り組んでいる。
      その過程で、コントローラーが意図した状態と実ネットワーク構成が乖離する「構成ドリフト」という課題に直面した。<br>

      構成ドリフトへの対応には、定期同期やイベントトリガ検出などのアプローチが存在する。それぞれ検知精度・スピード・運用コストの観点でトレードオフがあり、運用環境に応じた最適な方式を選択することが求められる。
      特にAI-Opsを活用したネットワーク自動化運用では、構成ドリフトの検知・同期についてよりタイムセンシティブになると考えている。 従来のような数時間おきの定期同期では、自律制御のスピード感に追いつくことができない。<br>

      本発表では、『K-SOT』において実際に採用している構成ドリフト検出および同期の仕組みを紹介する。特に、障害発生時や、手動による設定時の構成ドリフトに焦点を当て、その検出・修復をどのように実装しているかを具体的に説明する。
      ネットワークコントローラーが構成ドリフトにどう向き合うべきか、自動化とオペレーター介入のバランスなど参加者と意見交換したい。
    lessons:
      - ネットワークコントローラー/ネットワーク管理システムにおける構成ドリフトの検知・再同期の手法
      - ネットワークコントローラー/ネットワーク管理システムにおける内部データの状態管理手法
      - ネットワーク自動化におけるオペレーター介入の必要性・バランス
    level: 中級者向け
    references:
      - text: NTTドコモビジネス
        url: https://www.ntt.com/
    speakers:
      - description: |
          NTTドコモビジネス イノベーションセンター所属の坂井です。
          市販ネットワークコントローラーの検証やネットワークコントローラーの内製開発に従事しています。
        member_of: NTTドコモビジネス イノベーションセンター
        name: 坂井 立晟
