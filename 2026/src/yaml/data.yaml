  - begin_at: 13:50
    description: |
      パブリッククラウドは基本的に従量課金制であり、使ったら使った分だけ利用料金が発生します。そのため、不要なリソースが存在すると、その分も利用料金が発生し続けてしまいます。不要なリソース 1 つ 1 つは小さくても、放置し続けているとチリツモで思わぬ浪費に繋がります。<br>
      ドコモ CCoE ではドコモグループで利用している 2,400 以上の AWS アカウントを管理しています。そこで、塵を山にして可視化するべく、ドコモ CCoE で管理している全 AWS アカウントを対象に、不要なリソースと削減可能額を可視化するダッシュボードを作って全社公開してみました。ダッシュボードの構築は生成 AI を活用しつつ、1 人で 1 ヶ月程度で実施しました。<br><br>
      このセッションでは、<br>
      -「クラウドの不要なリソース」とは何なのか <br>
      -「クラウドの不要なリソースと削減可能額を可視化するダッシュボード」はどのようなものなのか<br>
      -ダッシュボードをどのように構築したのか<br>
      などについてお話しします。
    end_at: 14:20
    lessons:
      - クラウド利用におけるコスト削減のポイント
      - ドコモ CCoE におけるクラウドコスト最適化の取り組み
    level: 初級
    name: クラウドの不要なリソースと削減可能額を可視化するダッシュボードを作って全社公開した話
