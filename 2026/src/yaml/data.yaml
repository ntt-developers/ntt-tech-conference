  - begin_at: 13:50
    description: |
      パブリッククラウドは基本的に従量課金制であり、使ったら使った分だけ利用料金が発生します。そのため、不要なリソースが存在すると、その分も利用料金が発生し続けてしまいます。不要なリソース1つ1つは小さくても、放置し続けているとチリツモで思わぬ浪費に繋がります。<br>
      ドコモCCoEではドコモグループで利用している2,400以上のAWSアカウントを管理しています。そこで、塵を山にして可視化するべく、ドコモCCoEで管理している全AWSアカウントを対象に、不要なリソースと削減可能額を可視化するダッシュボードを作って全社公開してみました。ダッシュボードの構築は生成AIを活用しつつ、1人で1ヶ月程度で実施しました。<br><br>
      このセッションでは、
      - 「クラウドの不要なリソース」とは何なのか
      - 「クラウドの不要なリソースと削減可能額を可視化するダッシュボード」はどのようなものなのか
      - ダッシュボードをどのように構築したのか
      などについてお話しします。
    end_at: 14:20
    lessons:
      - クラウド利用におけるコスト削減のポイント
      - ドコモCCoEにおけるクラウドコスト最適化の取り組み
    level: 初級
    name: クラウドの不要なリソースと削減可能額を可視化するダッシュボードを作って全社公開した話
