    description: |
      レガシーな運用からの脱却とAI活用による業務変革の事例を紹介します 。<br>
      これまではWordのマニュアルや属人的な対応に頼っていたネットワーク運用において、SaaS製品の導入による自動化（TM Forum Lv3）を経て、現在は生成AIを活用した「自律的な運用（TM Forum Lv4）」への挑戦を進めています。<br>
      具体的には、AWS Bedrock (Knowledge Base/Agents) を採用し、アラート分析から原因特定・推奨手順の提案までを自律的に行うAIエージェントシステムのアーキテクチャや、その構築理由（セキュリティ、マネージドの利点など）を解説します。<br>
      また、AI導入における「嘘（ハルシネーション）」への対策や、社内セキュリティ基準のクリア、AIと人間の役割分担といった、現場ならではの苦労と解決策についても赤裸々にお話しします。
    end_at: 17:10
    lessons:
      - ネットワーク運用監視における、AWS BedrockとAWS Lambdaを組み合わせたサーバーレスなAIエージェントの構成例
      - RAG（検索拡張生成）を用いた、社内マニュアルや過去事例に基づく高精度なトラブルシューティング自動化の仕組み
