  - begin_at: 17:20
    description: |
      「その要件、本当に必要ですか？」<br>
      アーキテクトに求められる重要な能力の一つとして、ビジネスサイドの要望をシステム仕様へと落とし込む「翻訳能力」があります。この翻訳のさじ加減一つで、アーキテクチャはシンプルにも、複雑怪奇にもなり得ます。<br>
      本セッションでは、運用の属人化解消を目指して挑んだ「GKE から Cloud Run への移行」という取り組みとその結果として「断念」に至った意思決定のプロセス、そこからの学びについてお話しします。移行を断念した理由の中から、今回の学びに直結した「ビジネスサイドの要望を厳しい仕様に翻訳した結果、アーキテクチャの複雑さを招いたケース」にフォーカスして解説します。<br>
      一番のメッセージとしては、「要望を仕様（機能要件/非機能要件など）に落とし込む中でアーキテクチャをシンプルに保つ意識を強く持つべき」という点です。このメッセージの真意やこのように考える背景を上述したケースを用いてお伝えします。<br>
      また、書籍「ソフトウェアアーキテクチャの基礎」の原則（トレードオフ、前提を疑う責任）を紐解きながら、適切な要件定義（翻訳）によってシステムをシンプルに保つための知見を共有します。
    end_at: 17:50
    lessons:
      - ビジネス要望を技術仕様へ落とし込む際の観点
      - アーキテクチャドキュメントの重要性
      - アーキテクチャにはトレードオフがつきまとうという気づき
    level: 中級者向け
    name: ビジネス要望の翻訳が生むアーキテクチャの複雑性とトレードオフ
    references:
