    description: |
      レガシーな運用からの脱却と AI 活用による業務変革の事例を紹介します 。<br>
      これまでは Word のマニュアルや属人的な対応に頼っていたネットワーク運用において、SaaS 製品の導入による自動化（TM Forum Lv3）を経て、現在は生成 AI を活用した「自律的な運用（TM Forum Lv4）」への挑戦を進めています。<br>
      具体的には、AWS Bedrock (Knowledge Base/Agents) を採用し、アラート分析から原因特定・推奨手順の提案までを自律的に行う AI エージェントシステムのアーキテクチャや、その構築理由（セキュリティ、マネージドの利点など）を解説します。<br>
      また、AI 導入における「嘘（ハルシネーション）」への対策や、社内セキュリティ基準のクリア、AI と人間の役割分担といった、現場ならではの苦労と解決策についても赤裸々にお話しします。
    end_at: 17:10
    lessons:
      - ネットワーク運用監視における、AWS Bedrock と AWS Lambda を組み合わせたサーバーレスな AI エージェントの構成例
      - RAG（検索拡張生成）を用いた、社内マニュアルや過去事例にもとづく高精度なトラブルシューティング自動化の仕組み
      - 「社外にデータを学習させない」ためのセキュリティ対策と AWS 選定の理由
      - AI に「何を任せ、何を任せないか」という役割分担の設計と、AI を育てるためのプロセス
      - 現在の「優秀なアシスタント」フェーズから、将来的な「自律して動く専門家チーム」への進化に向けた展望
