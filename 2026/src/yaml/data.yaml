    description: |
      ドコモグループのクラウド CCoE（Cloud Center of Excellence）は、組織横断的なクラウド活用推進と開発者体験向上を担っています。この活動の一環として、開発者向け AI ツール Amazon Q Developer Pro (Kiro) の組織的な利用を可能にする共通基盤整備を実施しました。<br>
      CCoE の取り組みは、社内の規定を満たしつつ、使いたいユーザーが特別な障壁なしにすぐに利用を開始できる共通基盤を Organization 環境で構築することでした。<br>
      本セッションでは、この組織的な利用を可能にした CCoE による共通アクセス基盤の設計と、持続的な運用を支える戦略を共有します。また、この基盤を前提として進められている Kiro を活用した開発の取り組みについても、参考情報としてご紹介します。<br>
    end_at: 15:00
    lessons:
