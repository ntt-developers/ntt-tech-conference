          クラウドの本格利用に伴い、2013年頃からドコモCCoEを立ち上げ、セキュリティ、ガバナンス、ハイブリッドアーキテクチャの実現、等を主導。
          SaaSを含めた多くのパブリッククラウドを共通基盤として整備、管理、運用する仕組みを構築。<br>
