      CCoEの取り組みは、社内の規定を満たしつつ、使いたいユーザーが特別な障壁なしにすぐに利用を開始できる共通基盤をOrganization環境で構築することでした。<br>
      本セッションでは、この組織的な利用を可能にしたCCoEによる共通アクセス基盤の設計と、持続的な運用を支える戦略を共有します。また、この基盤を前提として進められているKiroを活用した開発の取り組みについても、参考情報としてご紹介します。<br>
    end_at: 15:00
    lessons:
